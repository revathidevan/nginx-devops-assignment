apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-devops-app
  template:
    metadata:
      labels:
        app: nginx-devops-app
    spec:
      containers:
        - name: nginx
          image: nginx-devops-app:1.0
          ports:
            - containerPort: 80